# Run from the repo root: `docker compose up -d --build` (dev, merges compose.override.yml).
# Deploy: `docker compose -f compose.yml --profile tunnel up -d --build`. Compose reads ./.env automatically.
# Memory budget (4 GB VPS, whole stack < 1 GB): postgres 144m + n8n 640m + api 128m + web 16m + cloudflared 48m = 976m.
# Node heap caps (NODE_OPTIONS / N8N_RUNNERS_MAX_OLD_SPACE_SIZE) sit below each mem_limit so V8 GCs before the OOM killer.
name: cincinnati-hotel
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 144m
    command: >-
      postgres
      -c shared_buffers=48MB
      -c max_connections=30
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=128MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}            # hotel
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: n8nio/n8n:${N8N_VERSION}          # pinned; never :latest
    restart: unless-stopped
    mem_limit: 640m
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}                  # n8n.<domain>
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_WEBHOOK_URL: https://${N8N_HOST}/  # replaces deprecated WEBHOOK_URL
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_PAYLOAD_SIZE_MAX: 64
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # Memory: cap the main heap and the Code-node task runner (an always-on child process in internal mode).
      NODE_OPTIONS: --max-old-space-size=320
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: 96
      N8N_RUNNERS_MAX_CONCURRENCY: 2
      # Keep only failed executions, pruned after 72 h.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 72
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 1000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./apps/n8n:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      postgres: { condition: service_healthy }
      n8n: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=96
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      N8N_MOCK: ${N8N_MOCK:-0}
      INTERNAL_BASE_URL: http://api:3000
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: 25
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    mem_limit: 16m
    depends_on: [api]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 48m
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [web, n8n]
    profiles: ["tunnel"]
    # Public hostnames (Zero Trust dashboard):  hotel.<domain> → http://web:80   n8n.<domain> → http://n8n:5678

volumes:
  pgdata:
  n8n_data:
  uploads:
