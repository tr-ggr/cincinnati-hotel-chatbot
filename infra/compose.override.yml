# Dev only. Run from repo root with: -f infra/docker-compose.yml -f infra/compose.override.yml
services:
  postgres:
    ports: ["5432:5432"]
  n8n:
    ports: ["5678:5678"]
    environment:
      N8N_PROTOCOL: http
      N8N_HOST: localhost
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
  api:
    ports: ["${API_HOST_PORT:-3000}:3000"]
  web:
    ports: ["8080:80"]
